name: Erro
description: Registrar comportamento incorreto ou falha
title: "[Erro] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Comportamento observado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Passos, dados e ambiente necessários.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Logs sanitizados, imagens ou identificadores de correlação.
