name: Entrega
description: Registrar uma funcionalidade ou resultado do projeto
title: "[Entrega] "
labels:
  - enhancement
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Resultado que deve ser alcançado.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critério de aceite
      description: Condição observável para concluir a entrega.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Decisões, acessos ou entregas necessárias.
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Produto e domínio
        - Frontend
        - Backend
        - Dados
        - Infraestrutura
        - Documentação
    validations:
      required: true
